name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: python -m pip install pre-commit==4.2.0
      - name: Check formatting
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            from_ref="${{ github.event.pull_request.base.sha }}"
          else
            from_ref="${{ github.event.before }}"
            if [ "$from_ref" = "0000000000000000000000000000000000000000" ]; then
              from_ref="$(git rev-list --max-parents=0 HEAD)"
            fi
          fi
          pre-commit run clang-format \
            --from-ref "$from_ref" \
            --to-ref "${{ github.sha }}" \
            --show-diff-on-failure

  unit-and-integration:
    name: unit-and-integration (${{ matrix.build_type }})
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install --yes cmake g++ libcli11-dev libibverbs-dev libspdlog-dev pkg-config
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DNDS_ENABLE_E2E_TESTS=OFF -DNDS_BUILD_NPU_CLIENT=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
