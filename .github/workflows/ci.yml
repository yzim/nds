name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: python -m pip install pre-commit==4.2.0
      - name: Check formatting
        run: pre-commit run clang-format --all-files --show-diff-on-failure

  unit-and-integration:
    name: unit-and-integration (${{ matrix.build_type }})
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install --yes cmake g++ libcli11-dev libibverbs-dev libspdlog-dev pkg-config
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DNDS_ENABLE_E2E_TESTS=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
