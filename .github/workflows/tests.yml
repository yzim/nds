name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-and-integration:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install --yes cmake g++ libcli11-dev libibverbs-dev libspdlog-dev pkg-config
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure --label-regex '^unit$'
      - name: Integration tests
        run: ctest --test-dir build --output-on-failure --label-regex '^integration$'
